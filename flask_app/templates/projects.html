<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Genri Labs</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <span class="topbar__title">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 17 V11 M10 11 L5 6 M10 11 L15 6 M5 6 V3 M15 6 H17" stroke="#5EC4C4" stroke-width="1.5" fill="none"/>
        <circle cx="10" cy="17" r="1.5" fill="#5EC4C4"/><circle cx="5" cy="3" r="1.5" fill="#5EC4C4"/><circle cx="17" cy="6" r="1.5" fill="#5EC4C4"/>
      </svg>
      Genri Labs admin
    </span>
    <nav class="topbar__nav" aria-label="Admin">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('projects_page') }}" aria-current="page">Projects</a>
    </nav>
    <div class="topbar__right">
      <span class="session-pill" id="session-pill" title="Time until automatic sign-out">
        Session · <span id="session-countdown">--:--</span>
      </span>
      <button class="btn-ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <main class="dash">
    <div class="page-head">
      <div>
        <h1>Projects</h1>
        <p class="page-head__sub">The “Real products, shipped” section of the public site. Saving publishes immediately.</p>
      </div>
      <div class="page-head__actions">
        <a class="btn-ghost" href="{{ public_site }}/#work" target="_blank" rel="noopener">View on site ↗</a>
        <button class="btn-accent" id="add-btn" type="button">Add project</button>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- ============ EDIT FORM (hidden until Add / Edit) ============ -->
    <form class="panel project-form" id="project-form" hidden novalidate>
      <h2 id="form-title">Add project</h2>
      <div class="form-grid">
        <label>Title
          <input name="title" maxlength="120" required />
        </label>
        <label>Link (URL)
          <input name="url" type="url" maxlength="255" placeholder="https://" required />
        </label>
        <label>Domain shown on card
          <input name="domain" maxlength="120" placeholder="Leave blank to use the link's domain" />
        </label>
        <label>Type
          <select name="kind">
            <option value="client">Client: built for a customer</option>
            <option value="lab">Lab: built in-house</option>
          </select>
        </label>
        <label class="form-grid__wide">Description
          <textarea name="description" maxlength="600" rows="3"></textarea>
        </label>
        <label>Order (lower shows first)
          <input name="sort_order" type="number" step="1" value="0" />
        </label>
        <label class="check">
          <input name="is_visible" type="checkbox" checked />
          Show on the public site
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-accent" type="submit" id="save-btn">Save</button>
        <button class="btn-ghost" type="button" id="cancel-btn">Cancel</button>
      </div>
    </form>

    <!-- ============ LIST ============ -->
    <section class="panel" aria-label="All projects">
      <ul class="project-list" id="project-list"></ul>
    </section>
  </main>

  <script>
    window.PUBLIC_SITE_URL = {{ public_site | tojson }};
    window.API_PROJECTS_URL = {{ url_for('api_projects_list') | tojson }};
    window.API_LOGOUT_URL = {{ url_for('api_logout') | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/session.js') }}"></script>
  <script src="{{ url_for('static', filename='js/projects.js') }}"></script>
</body>
</html>
